spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/postgres
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  server:
    port: 8081
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:/db/migration